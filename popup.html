<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Clean Capture</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icons/32.png" alt="" width="20" height="20"><h1>Clean Capture</h1></header>
  <main>
    <div class="seg" role="radiogroup" aria-label="What to make">
      <label><input type="radio" name="kind" value="shot" checked><span>Screenshot</span></label>
      <label><input type="radio" name="kind" value="rec"><span>Record video</span></label>
    </div>
    <div id="p-shot" role="group" aria-label="Screenshot of">
      <button data-mode="full">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M12 10v7m-3-3 3 3 3-3"/></svg>
        <span class="t"><b>Full page</b><span>Scrolls and stitches the whole page</span></span><kbd>Alt+Shift+F</kbd>
      </button>
      <button data-mode="element">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4"/><path d="M12 12l8 3-3.500 1.500L15 20z"/></svg>
        <span class="t"><b>Pick element</b><span>Hover to highlight any part, click to capture</span></span><kbd>Alt+Shift+E</kbd>
      </button>
      <button data-mode="area">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1" stroke-dasharray="3 3"/></svg>
        <span class="t"><b>Selected area</b><span>Drag a rectangle</span></span><kbd>Alt+Shift+A</kbd>
      </button>
      <button data-mode="visible">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
        <span class="t"><b>This tab</b><span>The part of the page you can see now</span></span><kbd>Alt+Shift+V</kbd>
      </button>
      <button data-open="recorder.html?shot=1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M9 21h6M12 17v4"/></svg>
        <span class="t"><b>Window or screen</b><span>Another window, app or the whole screen</span></span>
      </button>
    </div>
    <div id="p-rec" role="group" aria-label="Video of" hidden>
      <button data-rec="element" class="needs-crop">
        <svg class="rec" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4"/><path d="M12 12l8 3-3.500 1.500L15 20z"/></svg>
        <span class="t"><b>Pick element</b><span>Record only one part of this page</span></span>
      </button>
      <button data-rec="area" class="needs-crop">
        <svg class="rec" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1" stroke-dasharray="3 3"/></svg>
        <span class="t"><b>Selected area</b><span>Drag a rectangle on this page to record</span></span>
      </button>
      <button data-open="recorder.html?surface=browser">
        <svg class="rec" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
        <span class="t"><b>Browser tab</b><span>This tab or any other, with its sound</span></span>
      </button>
      <button data-open="recorder.html?surface=monitor">
        <svg class="rec" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M9 21h6M12 17v4"/></svg>
        <span class="t"><b>Window or screen</b><span>Another window, app or the whole screen</span></span>
      </button>
      <p id="nocrop" class="note" hidden>Recording a picked element or selected area needs Chrome or Edge.</p>
    </div>
    <p id="err" role="alert"></p>
  </main>
  <footer>
    <p>No ads · no tracking · captures stay on this device.</p>
    <button id="clear" class="link" type="button">Clear saved captures</button> <span id="cleared" role="status"></span>
  </footer>
  <script type="module" src="popup.js"></script>
</body></html>
